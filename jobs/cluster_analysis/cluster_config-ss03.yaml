# SS03 Mahjiang Streak Cluster Analysis Configuration
# This file contains configuration specific to the ss03 clustering project.
# Input files are produced by jobs/ss03_mahjiang_streak/etl_feature_engineer.py, which
# writes timestamped parquet files into jobs/output_ss03_mahjiang_streak/ named
# ss03_features_{grouped,enriched}_<groups_tag>_<YYYYMMDD_HHMMSS>.parquet.
# Update the `local_cache` suffix below to match the specific ETL run you want to analyze.

project_name: "ss03_2026"  # Current analysis environment
work_dir: "output_ss03_mahjiang_streak"  # Base working directory, where local cache of the input data will be saved.
s3_prefix: ""

data_loader:
  cluster_data:  # data to train cluster model.
    bucket: ""  # S3 bucket for input data
    prefix: ""  # S3 prefix for input data
    pattern: ''  # Pattern for grouped data files
    row_filters:  # General row filtering; empty string / null / [] entries are skipped.
      currency: ""  # Filter to specific currency
      math_table_id: "normal_zero"  # Restrict to a single math table; scalar -> equality, list -> isin.
    outlier_threshold: 0  # z score to filter outliers
    clip_threshold: [.025, .975]
    local_cache: "ss03_features_grouped_Default_20260512_163311.parquet"  # Update suffix to match ETL output.

