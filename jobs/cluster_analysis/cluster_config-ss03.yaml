      currency: ""  # Filter to specific currency
      math_table_id: "normal_zero"  # Restrict to a single math table; scalar -> equality, list -> isin.
    session_length: 100  # SS03 SESSION_LENGTH; rows whose (merge_on) group != session_length are dropped.
    local_cache: "ss03_features_enriched_Default_20260512_163311.parquet"  # Update suffix to match ETL output.

