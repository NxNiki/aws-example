# FM01 (fish_hunter) lifecycle user-day cluster analysis.
# Clusters the SAME Golden-7 features the lifecycle IO-HMM trains on -- the
# selected_hmm_features_fm01_cny table produced by
# jobs/fish_hunter/feature_engineer_life_cycle.py -- and the same rows: each
# user's first bet-day (where history features are undefined/NaN) is dropped
# via dropna_columns, matching the HMM's k>=2 training population.
#
# Run:
#   poetry run python jobs/cluster_analysis/cluster_analysis_pipeline.py \
#     --config_file jobs/cluster_analysis/cluster_config-fishunter_life_cycle.yaml \
#     --run-id $(date +%F_%H-%M-%S)
# Results upload to s3://bituslabs-team-ai/fishunter_life_cycle/k-means/<run-id>/

project_name: "fishunter_life_cycle"
work_dir: "output_fish_hunter/lifecycle_kmeans"  # local cache + per-run output folders
s3_prefix: ""

data_loader:
  cluster_data:
    bucket: "bituslabs-team-ai"
    prefix: "etl-results/lifecycle_feature_engineering/fm01_cny/selected_hmm_features_fm01_cny/"
    pattern: '\.parquet$'
    outlier_threshold: 0
    clip_threshold: [.025, .975]
    local_cache: "fishunter_life_cycle_features.parquet"
    # Same training population as the IO-HMM: drop rows with undefined history
    # features (exactly each user's first bet-day). Without this the runner's
    # fillna(0) would keep those rows as fake zeros.
    dropna_columns:
      - "no_bet_streak_days"
      - "bet_amount_ratio_today_vs_history"
      - "avg_bet_one_time_today_log"
      - "rtp_7_bet_days"
      - "loss_streak_ratio_today"
      - "current_balance_max_to_avg_bet_ratio"
      - "target_selection_entropy"
    # Same transform the HMM codebase applies to these three heavy-tailed
    # features (churn_helpers.LOG1P_FEATURES): fixed log1p, then only
    # standardization -- no fitted PowerTransformer on top.
    log1p_columns:
      - "bet_amount_ratio_today_vs_history"
      - "rtp_7_bet_days"
      - "current_balance_max_to_avg_bet_ratio"

    data_types:
      # NOT "category": the cache writer pins the first file's schema, and a small
      # first month gives int16 category codes that overflow on big months.
      user_id: "int64"
      no_bet_streak_days: "float64"
      bet_amount_ratio_today_vs_history: "float64"
      avg_bet_one_time_today_log: "float64"
      rtp_7_bet_days: "float64"
      loss_streak_ratio_today: "float64"
      current_balance_max_to_avg_bet_ratio: "float64"
      target_selection_entropy: "float64"

  attach_data:  # same table; labels re-attach onto user-day rows with raw context columns
    bucket: "bituslabs-team-ai"
    prefix: "etl-results/lifecycle_feature_engineering/fm01_cny/selected_hmm_features_fm01_cny/"
    pattern: '\.parquet$'
    bin_size: 1  # the grain is one row per (user_id, bet_date), so every group is a complete "bin" of 1
    local_cache: "fishunter_life_cycle_features_attach.parquet"

    columns_to_read:
      - "user_id"
      - "bet_date"
      - "no_bet_streak_days"
      - "bet_amount_ratio_today_vs_history"
      - "avg_bet_one_time_today_log"
      - "rtp_7_bet_days"
      - "loss_streak_ratio_today"
      - "current_balance_max_to_avg_bet_ratio"
      - "target_selection_entropy"
      # raw/debug context for interpreting clusters in business units
      - "bet_count_today"
      - "bet_amount_today"
      - "avg_bet_one_time_today"
      - "payout_today"
      - "profit_today"
      - "rtp_day"
      - "current_balance_day_max"
      - "max_consecutive_loss_count_today"

    cluster_stats_columns: ["user_id", "bet_amount_today", "current_balance_day_max"]

  merge_on: ["user_id", "bet_date"]  # unique user-day grain; joins cluster labels back onto attach_data

output:
  bucket: "bituslabs-team-ai"
  prefix: "fishunter_life_cycle/k-means"  # uploads land at <prefix>/<run-id>/...
  onnx:
    opset_version: 19

features:
  key_features:
    - "user_id"
    - "bet_date"

  skewed_features:  # power transform only where necessary: the HMM leaves this raw, but kmeans can't take the tail
    - "no_bet_streak_days"

  normal_features:  # already log-scaled (natively or via log1p_columns) or bounded [0, 1]
    - "bet_amount_ratio_today_vs_history"
    - "rtp_7_bet_days"
    - "current_balance_max_to_avg_bet_ratio"
    - "avg_bet_one_time_today_log"
    - "loss_streak_ratio_today"
    - "target_selection_entropy"

feature_selection:
  correlation_threshold: 0.9
  variance_threshold: 0.01

elbow_method:
  top_features: [5, 6, 7]  # only 7 features total
  k_range: [2, 3, 4, 5, 6, 7]

cluster_analysis:
  model: 'kmeans'
  random_state: 42
  n_init: 10
  n_clusters: 3  # parallel to the HMM's 3 behavioral states; revisit after the elbow sweep
  top_features: 7

pipeline:
  elbow_method: true
  cluster_analysis: true
  apply_model: false
  attach_cluster_label: true
  get_cluster_stats: false
  upload_result_to_s3: true
