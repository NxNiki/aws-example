# Deepdive Cluster Analysis Configuration
# This file contains configuration specific to the deepdive clustering project

project_name: "ss01_2026"  # Current analysis environment
work_dir: "output_ss01_wucaishen"  # Base working directory, where local cache of the input data will be saved.
s3_prefix: ""

