  attach_data:  # data to attach cluster index.
    bucket: ""  # S3 bucket for input data
    prefix: ""  # S3 prefix for input data
    pattern: ''  # Pattern for grouped data files
    row_filters:  # General row filtering (null to disable filtering)
      currency: ""  # Filter to specific currency
    session_length: 40  # stats in grouped data are calculated based on consecutive sessions, sample will be removed if session length not equal to this value for both cluster and attach data.
    local_cache: "ss01_features_enriched.parquet"

    columns_to_read:  # Columns to read from original data files
      - "user_id"
      - "session_group"
      - "agg_group"
      - "account"
      - "cus_account"
      - "currency"
      - "slottype"
      - "basepoint"
      - "delta_t"
      - "delta_bet"
      - "delta_profit"
      - "delta_payout"
      - "streak"
      - "win_streak"
      - "lose_streak"

  merge_on: ["user_id", "session_group", "agg_group"]  # Column used to attach cluster index to attach_data.

