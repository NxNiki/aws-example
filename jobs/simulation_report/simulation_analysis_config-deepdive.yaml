
# Wucaishen Simulation Analysis Configuration
# This file contains configuration specific to the wucaishen simulation project

project_name: "deepdive_simulation"  # Current analysis environment
work_dir: "output_simulation_deepdive"  # Base working directory, where local cache of the input data will be saved.

data_loader:
  bucket: "bituslabs-team-ai"  # S3 bucket for input data
  prefix: "gail_simulator_data_raw/results_v20250827/sim_20250905_3e4/" # S3 prefix for input data
  pattern: ".*_sessions_summary.csv$"  # Pattern for grouped data files
  local_cache: "wucaishen_simulation_20250905_3e4.parquet"
  row_filters:  # General row filtering (null to disable filtering)
      machine_id: ["dropTower", "giftShop", "rollerCoaster", "newBee"]

  columns_to_read:
    - "base_game_win"
    - "big_win_count"
    - "bonus_triggered"
    - "duration"
    - "end_reason"
    - "final_balance"
    - "first_bet"
    - "free_game_win"
    - "free_spins_count"
    - "initial_balance"
    - "machine_id"
    - "max_lose_streak"
    - "max_win_streak"
    - "player_id"
    - "return_to_player"
    - "session_id"
    - "sim_duration"
    - "streak"
    - "total_bet"
    - "total_profit"
    - "total_spins"
    - "total_win"
    - "win_count"
    - "win_rate"

  
  pca_columns:
    - "base_game_win"
    - "big_win_count"
    - "duration"
    - "final_balance"
    - "first_bet"
    - "free_game_win"
    - "free_spins_count"
    - "initial_balance"
    - "max_lose_streak"
    - "max_win_streak"
    - "return_to_player"
    - "sim_duration"
    - "streak"
    - "total_bet"
    - "total_profit"
    - "total_spins"
    - "total_win"
    - "win_count"
    - "win_rate"