<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__TITLE__</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           max-width: 1200px; margin: 1em auto; padding: 0 1em; color: #222; }
    h1 { margin-bottom: 0.2em; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: 0.3em; margin-top: 2em; }
    .filters { margin: 0.6em 0 1em; padding: 0.6em; background: #f5f5f7; border-radius: 6px; }
    .filters > label { margin-right: 1.2em; font-size: 0.95em; }
    .filters select { font-size: 0.95em; padding: 2px 6px; }
    .cb { margin-right: 0.6em; font-weight: normal; font-size: 0.95em; }
    .cb-row { margin-top: 0.4em; }
    .cb-row strong { display: inline-block; min-width: 90px; }
    .cb-row button { font-size: 0.8em; margin: 0 0.2em 0 0.4em; padding: 1px 6px; cursor: pointer; }
    .meta { color: #666; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>__TITLE__</h1>
  <p class="meta">__META__</p>

  <div class="filters">
    <strong>Values:</strong>
    <label class="cb"><input type="radio" name="dataMode" value="transformed" checked>
      Transformed (power transform + __SCALER_KIND__)</label>
    <label class="cb"><input type="radio" name="dataMode" value="raw"> Raw</label>
  </div>

  <h2>Radar Plot</h2>
  <div class="filters">
    <label>Agg method: <select id="aggSelect">__AGG_OPTIONS__</select></label>
    <div class="cb-row">
      <strong>Math table:</strong>
      <button type="button" data-group="math" data-action="all">All</button>
      <button type="button" data-group="math" data-action="none">None</button>
      __MATH_BOXES__
    </div>
    <div class="cb-row">
      <strong>Cluster:</strong>
      <button type="button" data-group="cluster" data-action="all">All</button>
      <button type="button" data-group="cluster" data-action="none">None</button>
      __CLUSTER_BOXES__
    </div>
  </div>
  __RADAR_HTML__

  <h2>Distribution Plots</h2>
  __SIG_NOTE__
  __RAW_NOTE__
  __BOX_FILTERS_HTML__
  __BOX_HTML__

  <script type="application/json" id="dashboard-bootstrap">__BOOTSTRAP_JSON__</script>
  <script>
__SCRIPT__
  </script>
</body>
</html>
