# Deepdive Cluster Analysis Configuration
# This file contains configuration specific to the deepdive clustering project

project_name: "deepdive_2025_month_1-8_test"  # Current analysis environment
work_dir: "deepdive"  # Base working directory, where local cache of the input data will be saved.

data_loader:
  cluster_data:  # data to train cluster model.
    bucket: "hyber-slot"  # S3 bucket for input data
    prefix: "deepdive_groupdata"  # S3 prefix for input data
    pattern: '250[1-8]/deepdive_grouped_stat_output/part.*\.csv$'  # Pattern for grouped data files
    row_filters:  # General row filtering (null to disable filtering)
      currency: "CNY"  # Filter to specific currency
    outlier_threshold: 3  # z score to filter outliers
    local_cache: "deepdive_grouped_data_2025.csv"

  attach_data:  # data to attach cluster index.
    bucket: "hyber-slot"  # S3 bucket for input data
    prefix: "deepdive_groupdata"  # S3 prefix for input data
    pattern: '250[1-8]/deepdive_enriched_output/part.*\.csv$'  # Pattern for grouped data files
    local_cache: "deepdive_enriched_data_2025.csv"

    columns_to_read:  # Columns to read from original data files
      - "loginname"
      - "billno"
      - "billtime"
      - "account"
      - "cus_account"
      - "currency"
      - "slottype"
      - "basepoint"
      - "delta_t"
      - "delta_bet"
      - "delta_profit"
      - "delta_payout"
      - "streak"
      - "win_streak"
      - "lose_streak"
      - "result_clean"
      - "group_id"
    row_filters:  # General row filtering (null to disable filtering)
      currency: "CNY"  # Filter to specific currency

  merge_on: "group_id"  # Column used to attach cluster index to attach_data.

output:
  bucket: "bituslabs-team-ai"  # S3 bucket for output data
  prefix: "deepdive_analysis_kmeans"  # S3 prefix for output data
  # ONNX model configuration
  onnx:
    opset_version: 19  # ONNX opset version for model conversion

features:
  key_features:  # Features used to identify rows for joining with other tables
    - "group_id"
    - "loginname"
    - "start_time"
    - "currency"
  
  skewed_features:  # Features that need power transformation
    - "rtp_mean"
    - "bet_min"
    - "bet_max"
    - "bet_mean"
    - "bet_p25"
    - "bet_median"
    - "bet_p75"
    - "basepoint_min"
    - "basepoint_max"
    - "basepoint_mean"
    - "basepoint_p25"
    - "basepoint_median"
    - "basepoint_p75"
    - "payout_min"
    - "payout_max"
    - "payout_mean"
    - "payout_p25"
    - "payout_median"
    - "payout_p75"
    - "profit_min"
    - "profit_max"
    - "profit_mean"
    - "profit_p25"
    - "profit_median"
    - "profit_p75"
    - "delta_t_min"
    - "delta_t_max"
    - "delta_t_mean"
    - "delta_t_p25"
    - "delta_t_median"
    - "delta_t_p75"
    - "delta_bet_min"
    - "delta_bet_max"
    - "delta_bet_mean"
    - "delta_bet_p25"
    - "delta_bet_median"
    - "delta_bet_p75"
    - "delta_profit_min"
    - "delta_profit_max"
    - "delta_profit_mean"
    - "delta_profit_p25"
    - "delta_profit_median"
    - "delta_profit_p75"
    - "streak_min"
    - "streak_max"
    - "streak_mean"
    - "streak_p25"
    - "streak_median"
    - "streak_p75"
    - "win_streak_min"
    - "win_streak_max"
    - "win_streak_mean"
    - "win_streak_p25"
    - "win_streak_median"
    - "win_streak_p75"
    - "lose_streak_min"
    - "lose_streak_max"
    - "lose_streak_mean"
    - "lose_streak_p25"
    - "lose_streak_median"
    - "lose_streak_p75"
    - "deposit_min"
    - "deposit_max"
    - "deposit_mean"
    - "deposit_p25"
    - "deposit_median"
    - "deposit_p75"
  
  normal_features:  # Features that don't need transformation
    - "slottype_2_count"
    - "slottype_16_count"
    - "slottype_17_count"
    - "payout_rate"
    - "profit_rate"
    - "profit_stddev"
    - "account_stddev"
    - "morning_count"
    - "afternoon_count"
    - "night_count"
    - "midnight_count"
    - "weekend_count"
    - "duration_seconds"
    - "avg_time_per_bet"
    - "currency_label"
        

feature_selection:
  correlation_threshold: 0.9  # Threshold for removing highly correlated features
  variance_threshold: 0.01  # Threshold for removing low-variance features

elbow_method:
  top_features: [15, 20, 25, 30, 35, 40, 45, 50]  # Range of k values to test
  k_range: [2, 3, 4, 5, 6, 7]  # Range of k values to test

cluster_analysis:
  random_state: 42  # Random state for reproducible results
  n_init: 10  # Number of initializations for K-means algorithm
  n_clusters: 3  # Default number of clusters for K-means
  top_features: 40  # Default number of top features to use

pipeline:
  elbow_method: true  # Run elbow method analysis
  cluster_analysis: true  # Run cluster analysis with selected features and n_clusters  
  fit_cluster_model: false  # Apply trained model to new data
  attach_cluster_label: true  # Attach cluster indices to original data



