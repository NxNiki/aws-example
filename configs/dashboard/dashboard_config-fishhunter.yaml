title: "Fish Hunter Analytics"

stats_by_date: 
  files: 
    day: [
      "s3://bituslabs-team-ai/etl-results/jobs/output_fish_hunter_v2/daily_stats",
    ]

    week: [
      "s3://bituslabs-team-ai/etl-results/jobs/output_fish_hunter_v2/weekly_stats",
    ]

    month: [
      "s3://bituslabs-team-ai/etl-results/jobs/output_fish_hunter_v2/monthly_stats",

    ]

  group_col: "daily_group"
  date_col: "activity_date"
  user_group_cols: [daily_group, fish_value, user_group]
  # Stored grain is one row per (period, user, daily_group, fish_value); the
  # fish-level picker buckets fish_value by user-defined INCLUSIVE [min, max]
  # ranges, and the API collapses rows back to one per user when unselected.
  user_row_grain: [fish_value]
  range_group:
    column: fish_value
    name: "Fish level"
    defaults:
      - {label: low, min: 2, max: 10}
      - {label: medium, min: 15, max: 130}
      - {label: high, min: 150, max: 200}
      - {label: ultra, min: 500, max: 1000}

  group1_label: "DAU and Retention"
  group1_columns: [
    # DataMetrics-computed (derived from user-level rows in dashboard):
    "num_active_users",
    "day0_num_users",
    "day1_num_users",
    "day3_num_users",
    "day5_num_users",
    "day7_num_users",
    "day10_num_users",
    "day15_num_users",
    "day30_num_users",
    "retention_rate_day1",
    "retention_rate_day3",
    "retention_rate_day5",
    "retention_rate_day7",
    "retention_rate_day10",
    "retention_rate_day15",
    "retention_rate_day30",
    # Parquet column (per-user flag, averaged to get fraction who killed fish):
    "user_killed_fish",
  ]

  group2_label: "Bet and RTP"
  group2_columns: [
    "user_total_bet",
    "user_avg_bet_amount",
    "user_total_payout",
    "user_rtp",
    "rtp",
    "user_total_profit",
    "user_max_profit",
    "user_bullet_avg_profit",
    "user_bullet_kill_avg_profit",
    "user_num_streak_sessions",
    "user_avg_streak_length",
    "user_max_streak_length",
    "user_min_streak_length",
    "user_seconds_to_kill_fish",
    "user_seconds_to_kill_fish_low",
    "user_seconds_to_kill_fish_medium",
    "user_seconds_to_kill_fish_high",
    "user_seconds_to_kill_fish_ultra",
    "user_bets_to_kill_fish",
    "user_bets_to_kill_fish_low",
    "user_bets_to_kill_fish_medium",
    "user_bets_to_kill_fish_high",
    "user_bets_to_kill_fish_ultra",
    "user_accu_pos_delta_bet",
    "user_accu_neg_delta_bet",
    "user_accu_pos_delta_bet_avg",
    "user_accu_neg_delta_bet_avg",
    "user_accu_delta_bet",
    "user_accu_delta_bet_avg",
    "user_pos_delta_bet_num",
    "user_neg_delta_bet_num",
  ]

  group3_label: "Fish Value and Bullets"
  group3_columns: [
    "user_avg_fish_value",
    "user_avg_killed_fish_value",
    "user_num_bets",
    "user_num_killed_bullets",
    "user_bullet_kill_ratio",
    "user_num_rooms",
    "user_profit_coef_var",
    "user_max_kill_streak",
    "user_max_kill_streak_low",
    "user_max_kill_streak_medium",
    "user_max_kill_streak_high",
    "user_max_kill_streak_ultra",
    "user_avg_kill_streak",
    "user_avg_kill_streak_low",
    "user_avg_kill_streak_medium",
    "user_avg_kill_streak_high",
    "user_avg_kill_streak_ultra",
  ]

stats_by_bet:
  files: [
    "s3://bituslabs-team-ai/etl-results/jobs/output_fish_hunter/bullet_stats_by_index.parquet",
    "s3://bituslabs-team-ai/etl-results/jobs/output_fish_hunter/bullet_stats_by_index_pa.parquet",
  ]

  group_col: "session_group"

# Weekly ops report (ETL: jobs/operation_daily_report/etl_weekly_report_all_games.py)
weekly_report:
  game_id: "FM01"
  currency_type: "CNY"
  files:
    - "s3://bituslabs-team-ai/etl-results/jobs/output_weekly_report_all_games/ops_daily_report"
