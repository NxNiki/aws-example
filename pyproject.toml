[tool.poetry]
name = "aws_project"
version = "0.1.0"
description = "A data science project using AWS SageMaker, PySpark, and Scikit-learn"
authors = ["Xin Niu <michaelniki1988@.gmail.com>"]
readme = "README.md"
packages = [{ include = "bituslabs_ds", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.9.0,<3.13"
numpy = "^1.26.0"
pandas = "2.1.0"
skl2onnx = "1.16.0"
onnx = "^1.17.0"
scikit-learn = "^1.5.0"
sagemaker = "2.247.0"
boto3 = "1.38.22"
pyarrow = "^14.0.1"
matplotlib = "^3.9.0"
seaborn = "^0.13.2"
pyspark = "3.0.0" # do not build package with pyspark when submit job to AWS EMR
openpyxl = "^3.1.5"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0"
pytest = "^8.0"
isort = "^6.0.1"
black = "^24.3"
mypy = "^1.10"
flake8 = "^7.0"
pre-commit = "^4.2.0"
pyjanitor = "^0.31.0"
ydata-profiling = "^4.16.1"
pyspark-stubs = "^3.0.0.post3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["bituslabs_ds"]
known_third_party = ["numpy", "pandas"]
combine_as_imports = true
include_trailing_comma = true
multi_line_output = 3
force_grid_wrap = 0
use_parentheses = true
