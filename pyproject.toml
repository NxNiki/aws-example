[tool.poetry]
name = "aws_project"
version = "0.1.0"
description = "A data science project using AWS SageMaker, PySpark, and Scikit-learn"
authors = ["Xin Niu <michaelniki1988@.gmail.com>"]
readme = "README.md"
packages = [
    { include = "bituslabs_ds", from = "src" },
    { include = "dashboard_api", from = "src" },
    { include = "ai_agent", from = "src" },
    { include = "rag_service", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.10.0.0,<3.13"
numpy = "^1.26.0"
pandas = "^2.2.0"
boto3 = "1.38.22"
pyarrow = "^14.0.1"
fastparquet = "2024.11.0"
pyyaml = "^6.0.2"
python-dotenv = "^1.2.1"
# stable_baselines3 = "^2.2.1"
# gymnasium = "^0.29.0"
# imitation = "^1.0.1"
# giotto-tda = "^0.6.0"

[tool.poetry.group.ds]
optional = true
[tool.poetry.group.ds.dependencies]
scipy = "^1.12.0"
cca-zoo = "^3.0.0"
diptest = "^0.10.0"
pingouin = "^0.5.1"
openpyxl = "^3.1.5"
matplotlib = "^3.9.0"
seaborn = "^0.13.2"
statannotations = "^0.7.1"
pymc = "^5.10"
arviz = "^0.18.0"

[tool.poetry.group.ml]
optional = true
[tool.poetry.group.ml.dependencies]
scikit-learn = "^1.5.0"
sagemaker = "2.247.0"
skl2onnx = "1.16.0"
onnx = "^1.17.0"
smdebug = "1.0.34"

[tool.poetry.group.dl]
optional = true
[tool.poetry.group.dl.dependencies]
torch = "^2.10.0"
torchvision = "^0.25.0"
torchaudio = "^2.10.0" 
lightning = "^2.4.0" # Modern standard for organizing PyTorch code

# dashboard_api — the new lightweight FastAPI service backing the React SPA
# (data + report API; serves the built SPA static assets). LLM-free and
# Plotly/kaleido-free by design: agent turns go to the ai_agent service, and
# Confluence export uses client-rendered PNGs. See docs/frontend_redesign.md.
[tool.poetry.group.dashboard_api]
optional = true
[tool.poetry.group.dashboard_api.dependencies]
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.30.0"}
polars = "^1.38.1"  # avoid 1.38.0 (yanked on PyPI)

# LangChain / LangGraph stack — only the ai_agent service runs the LLM
# in-process now (the dashboard calls it over HTTP via /api/chat and
# /api/report/*), so the dashboard image no longer needs these.
[tool.poetry.group.llm]
optional = true
[tool.poetry.group.llm.dependencies]
langchain = ">=0.3.0"
langchain-openai = ">=0.3.0"
langchain-google-genai = ">=4.0.0"
langgraph = ">=0.2.0"

# Confluence client + HTTP — used by both surfaces:
#  * ai_agent: chat-agent tools and report-tab reference inlining
#  * dashboard: report-tab reference fetching (load_references) and
#    PNG export to Confluence (exporter.py)
# Kept in a separate group so the dashboard image can install Confluence
# integration without dragging in the LangChain stack.
[tool.poetry.group.confluence]
optional = true
[tool.poetry.group.confluence.dependencies]
atlassian-python-api = ">=3.41.0"
requests = ">=2.32.0"

# ai_agent group is now just the HTTP-server-specific extras.
# Install alongside 'llm':  poetry install --only main,llm,ai_agent
[tool.poetry.group.ai_agent]
optional = true
[tool.poetry.group.ai_agent.dependencies]
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.30.0"}
# Slack bot — Bolt for HTTPS event routing + signing-secret verification.
# Pulls in slack-sdk transitively (no need to list it separately). aiohttp
# is an *optional* dep of slack-bolt that the async path imports at module
# load (slack_bolt.async_app does `from aiohttp import web`), so we must
# list it explicitly or the AsyncApp import fails at runtime.
slack-bolt = ">=1.20.0"
aiohttp = ">=3.9.0"

# RAG microservice — its own group keeps the service image slim
# (no langchain, no dash). Only the indexer/retriever/FastAPI app pull this in.
[tool.poetry.group.rag_service]
optional = true
[tool.poetry.group.rag_service.dependencies]
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.30.0"}
faiss-cpu = ">=1.8.0"
opensearch-py = ">=2.6.0"
# Embedding providers — at least one API key (OPENAI_API_KEY or
# GOOGLE_API_KEY/GEMINI_API_KEY) must be set; both SDKs are installed so
# the embedder can auto-fall-back at runtime.
openai = ">=1.40.0"
google-generativeai = ">=0.8.0"
atlassian-python-api = ">=3.41.0"
requests = ">=2.32.0"

[tool.poetry.group.etl]
optional = true 
[tool.poetry.group.etl.dependencies]
redshift_connector = "^2.0.0"
paramiko = "^4.0.0"
awswrangler = "^3.7.0"
slack-sdk = "^3.27.0"

[tool.poetry.group.spark]
optional = true
[tool.poetry.group.spark.dependencies]
pyspark = "3.5.0"  # do not build package with pyspark when submit job to AWS EMR

[tool.poetry.group.dev.dependencies]
isort = "^6.0.1"
black = "^24.3"
mypy = "^1.10"
flake8 = "^7.0"
pre-commit = "^4.2.0"
pyjanitor = "^0.31.0"
# pyspark-stubs = "^3.0.0.post3"
types-pyyaml = "^6.0.12.20250822"
types-paramiko = "^3.4.0"
types-requests = "^2.32.0"
jupyter = "^1.0"
bokeh = "^3.4.3"
ydata-profiling = "^4.16.1"
plotly = "^6.3.1"
dash = "^3.2.0"

[tool.poetry.group.test.dependencies]
# Core testing framework
pytest = "^8.0"
pytest-cov = "^4.0"
pytest-xdist = "^3.0"
pytest-mock = "^3.10"

# AWS mocking
moto = {extras = ["all"], version = "^4.2"}

# Performance testing
psutil = "^5.9"

# Documentation
sphinx = "^7.0"
sphinx-rtd-theme = "^1.3"

# Additional testing utilities
hypothesis = "^6.80"
freezegun = "^1.2"
responses = "^0.23"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.pyright]
# Resolve `from dashboards.*` / `from bituslabs_ds.*` without sys.path hacks
extraPaths = ["src"]

[tool.mypy]
# Same purpose as pyright's extraPaths — let mypy find the src/ layout.
mypy_path = "src"
ignore_missing_imports = true

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["bituslabs_ds", "dashboard_api", "ai_agent", "rag_service"]
known_third_party = ["numpy", "pandas"]
combine_as_imports = true
include_trailing_comma = true
multi_line_output = 3
force_grid_wrap = 0
use_parentheses = true
