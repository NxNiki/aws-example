repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
        args: [--line-length=120]

      - id: isort
        name: isort
        entry: isort
        language: system
        types: [python]
        args: [--profile=black, --line-length=120]

      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        args: [--ignore-missing-imports]
        # One-off analysis scripts carry pre-existing type debt (the hook only
        # sees files when they change, e.g. on a move); same policy as the
        # legacy flake8 scope in Makefile lint-new.
        exclude: ^jobs/analyses/
